name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: publish self-contained
        run: >
          dotnet publish winapp/TodoCalendar.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out

      - name: pack
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $dir = "dist/日历待办-v$ver"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item out/TodoCalendar.exe $dir
          (Get-Content tools/先看这个.txt -Raw -Encoding UTF8).Replace('@VERSION@', $ver) |
            Set-Content "$dir/先看这个.txt" -Encoding utf8
          Copy-Item docs/使用说明.txt "$dir/更新记录.txt"
          Compress-Archive -Path $dir -DestinationPath "dist/TodoCalendar-v$ver-win64.zip"
          Get-FileHash "dist/TodoCalendar-v$ver-win64.zip" -Algorithm SHA256 |
            ForEach-Object { $_.Hash } | Set-Content "dist/SHA256.txt" -Encoding utf8

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256.txt
          generate_release_notes: true
          body: |
            下载 `TodoCalendar-${{ github.ref_name }}-win64.zip` 解压即用，不需要安装 .NET。
            首次运行若出现「Windows 已保护你的电脑」，点「更多信息 → 仍要运行」。
